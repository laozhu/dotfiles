# Shadowrocket counterpart of home/.config/sing-box/config.json.
# Secret-free: scripts/serve-once.sh shares it over plain HTTP on the LAN for import.
# Nodes come from nodes.txt; the url-test groups select them by name.
# Proxy server connections bypass these rules, so no hostnames or IPs live here.

[General]
bypass-system = true
ipv6 = false
prefer-ipv6 = false
dns-server = https://dns.alidns.com/dns-query
skip-proxy = 127.0.0.1,localhost,*.local,captive.apple.com

[Proxy Group]
🚀 proxy = select,⚡ auto,🇸🇬 singapore,🇺🇸 usa,policy-select-name=⚡ auto
⚡ auto = url-test,url=https://www.gstatic.com/generate_204,interval=180,tolerance=50,timeout=5,policy-regex-filter=^(sg|us)-(hy2|vless)$
🇸🇬 singapore = url-test,url=https://www.gstatic.com/generate_204,interval=180,tolerance=50,timeout=5,policy-regex-filter=^sg-(hy2|vless)$
🇺🇸 usa = url-test,url=https://www.gstatic.com/generate_204,interval=180,tolerance=50,timeout=5,policy-regex-filter=^us-(hy2|vless)$

[Rule]
# ip_is_private
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR6,fc00::/7,DIRECT,no-resolve
IP-CIDR6,fe80::/10,DIRECT,no-resolve
# custom-proxy
DOMAIN-SUFFIX,github.com,🚀 proxy
DOMAIN-SUFFIX,npass.app,🚀 proxy
DOMAIN-SUFFIX,logitechg.com,🚀 proxy
DOMAIN-SUFFIX,logi.com,🚀 proxy
