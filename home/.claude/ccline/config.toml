# Team subscription: no per-token billing, so no cost widgets.
# Line 1 = work location (dir, branch, PR, churn); line 2 = session state and what can
# run out (model, context, 5h/7d limits). Low priority drops first when narrow.
# Plain skin + terminal palette: no background fills, colors follow the terminal theme.
preset = "plain"
palette = "terminal"
skin = "plain"
glyphs = "nerd"
separator = "  "

[[line]]
left = [
  { metric = "dir", color = "blue", priority = 5 },
  { metric = "git", priority = 5 },
  { metric = "pr", priority = 3 },
  { metric = "lines", priority = 2 },
]

[[line]]
left = [
  { metric = "model", color = "magenta", compact = "{family}", priority = 5 },
  { metric = "context", widget = "text", format = "{pct}%", priority = 5 },
  { metric = "quota.5h", widget = "text", icon = "󰅐", format = "5h {pct}%[ · {left}]", compact = "5h {pct}%", minimal = "{pct}%", priority = 5 },
  { metric = "quota.7d", widget = "text", icon = "󰃭", format = "7d {pct}%[ · {left}]", compact = "7d {pct}%", minimal = "{pct}%", priority = 4 },
  { metric = "activity.agents", priority = 3 },
  { metric = "activity.tools", priority = 3 },
]
